<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Top OS Professionnels - StackOverflow 2023</title>
    <link rel="stylesheet" href="../css/top_os.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>Top systèmes d’exploitation utilisés (professionnel)</h1>
    <p>
        Visualisez les systèmes d’exploitation les plus utilisés par métier.  
        Sélectionnez un métier et la taille du TOP à afficher (5 → 8).
    </p>
</header>

<section class="filters">

    <div class="filter-block">
        <label>Métier (DevType) :</label>
        <select id="devtypeSelect">
            <option value="">Sélectionner un métier</option>
        </select>
    </div>

    <div class="filter-block">
        <label>Top N :</label>
        <select id="topNSelect">
            <option value="5">Top 5</option>
            <option value="6">Top 6</option>
            <option value="7">Top 7</option>
            <option value="8">Top 8</option>
        </select>
    </div>

    <button id="btnGenerate">Générer</button>
</section>

<section class="chart-container">
    <div class="chart-wrapper">
        <canvas id="osChart"></canvas>
        <div id="legendZone"></div>
    </div>
</section>

<script src="../js/data_loader.js"></script>
<script src="../js/top_os.js"></script>

</body>
</html>
